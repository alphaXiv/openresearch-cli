<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OpenResearch CLI</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong palette.
      // Storage key and resolution must match src/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("orx:theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      /* Pre-CSS background; keep in sync with --base in src/styles.css. */
      html { background: #ffffff; }
      html[data-theme="dark"] { background: #0e0c0c; }
    </style>

  </head>
